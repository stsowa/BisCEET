[project]
name = "BisCEET"
version = "1.0.0"
description = "BisCEET is a Python/Tkinter desktop application for visualizing, comparing, and analyzing biosynthetic gene clusters from GenBank files."
readme = "README.md"
requires-python = ">=3.12"
license-files = { paths = ["LICENSE"] }
keywords = [
    "cheminformatics",
    "genomics"
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry"
]

dependencies = [
    "biopython~=1.79"
]

[project.urls]
"Repository" = "https://github.com/stsowa/BisCEET"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["source"]

